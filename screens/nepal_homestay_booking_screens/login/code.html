<div class="relative group">
<input class="w-full h-12 bg-surface-container-low border border-outline-variant rounded-lg px-md font-body-md text-body-md focus:outline-none focus:border-secondary transition-all group-hover:border-outline" id="identity" name="identity" placeholder="Enter your details" type="text"/>

</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<div class="flex justify-between items-center px-1">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="password">Password</label>
<a class="font-label-sm text-label-sm text-secondary hover:text-primary transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative group">
<input class="w-full h-12 bg-surface-container-low border border-outline-variant rounded-lg px-md font-body-md text-body-md focus:outline-none focus:border-secondary transition-all group-hover:border-outline" id="password" name="password" placeholder="••••••••" type="password"/>
<button class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 text-on-surface-variant/50 text-[20px] hover:text-on-surface" id="togglePassword" type="button">visibility</button>
</div>
</div>
<!-- Action Button -->
<button class="w-full h-14 bg-primary text-on-primary font-headline-md text-[18px] rounded-lg shadow-lg hover:shadow-xl active:scale-[0.98] transition-all flex items-center justify-center gap-sm mt-base group" type="submit">
<span>Login</span>
<span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="relative my-xl">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant/50"></div>
</div>
<div class="relative flex justify-center text-label-sm">
<span class="bg-surface-container-lowest px-md text-on-surface-variant font-label-sm">or continue with</span>
</div>
</div>
<!-- Social Logins -->

<img class="w-32 h-32 rounded-xl object-cover grayscale brightness-50" data-alt="A atmospheric image of a traditional copper teapot resting on a stone hearth with low, warm glowing embers. Soft smoke curls upwards into a dimly lit room, capturing the serene and welcoming essence of a Himalayan mountain kitchen at dusk." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAmppkS-q9j67jCRiYZgLxQCPS7JUDWc0fyQubwULk9LL26MN6wYnskmKZLHMYlsZsYX5bRxgY5dT5s597dgMYlsbkLniM-XS-Kg9f9TMooubrFkLHrzhhvH9xCZahPkIRP43-uYE-aMlIrLD2dCnaA0UqZIczyRxVxSA73mbiltm1Y6ZhzhviEcm2Wi1-br-clHUlM0LL19JzKodq0YDtaj623sLUA2HT01JiDhmfrX8VHdN4zTpfzH9qrZYln7Zm8iLAi4rSYlxo"/>
</div>

<script>
        // Micro-interactions
        const toggleBtn = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        toggleBtn.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            toggleBtn.textContent = type === 'password' ? 'visibility' : 'visibility_off';
        });

        // Form submission animation
        const form = document.getElementById('loginForm');
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = form.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            
            btn.disabled = true;
            btn.innerHTML = `<span class="material-symbols-outlined animate-spin">progress_activity</span>`;
            
            setTimeout(() => {
                btn.innerHTML = `<span class="material-symbols-outlined">check_circle</span>`;
                btn.classList.replace('bg-primary', 'bg-tertiary-container');
                setTimeout(() => {
                    btn.innerHTML = originalContent;
                    btn.disabled = false;
                    btn.classList.replace('bg-tertiary-container', 'bg-primary');
                }, 1500);
            }, 1000);
        });

        // Subtle parallax on mouse move
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX - window.innerWidth / 2) / 50;
            const y = (e.clientY - window.innerHeight / 2) / 50;
            document.querySelector('.dhaka-pattern').style.transform = `translate(${x}px, ${y}px)`;
        });
    </script>
