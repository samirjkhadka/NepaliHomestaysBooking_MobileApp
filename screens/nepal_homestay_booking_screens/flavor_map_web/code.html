<style>

<script>
        const regionalData = {
            thakali: {
                title: "Thakali Heritage",
                region: "Mustang / Mustang District",
                image: "placeholder",
                imageAlt: "A beautifully arranged Thakali Thali set on a rustic wooden table in a traditional Mustang home. The meal includes fluffy white rice, creamy black lentil dal, spicy mutton curry, local mustard greens, and fermented radish pickle (gundruk). The lighting is warm and golden, coming from a nearby hearth. The aesthetic is tactile and authentic, reflecting the Modern Heritage design language with earthy reds and browns.",
                description: "Originating from the Thak Khola region of Mustang, Thakali cuisine is renowned across Nepal for its balance of flavors and high-quality ingredients. Historically, the Thakali people were traders on the salt route, which influenced their access to diverse spices and fine grains.",
                ingredients: ["Jimbu (Wild Himalayan Allium)", "Buckwheat (Fapar)", "Dried Yak Meat (Sukuti)", "Timmur (Szechuan Pepper)", "Ghee"],
                homestays: [
                    { name: "Nilgiri View Lodge", loc: "Marpha", rating: 4.8 },
                    { name: "Aama's Mustang Hearth", loc: "Jomsom", rating: 4.9 }
                ]
            },
            newari: {
                title: "Newari Gastronomy",
                region: "Kathmandu Valley",
                image: "placeholder",
                imageAlt: "An elaborate Samay Baji set, a traditional Newari feast. The arrangement includes beaten rice, roasted buffalo meat (Choila), black soybeans, ginger, garlic, and local aila (liquor) in a small clay pot. The setting is an old Kathmandu courtyard with intricate wood carvings in the background. The color palette features deep reds, charcoal blacks, and golden ochre, reflecting the vibrant cultural legacy of the Newar people.",
                description: "The Newars of Kathmandu Valley have one of the most sophisticated culinary traditions in South Asia. Their food is deeply tied to religious festivals and agricultural cycles, featuring a wide variety of fermented foods and slow-cooked buffalo meats.",
                ingredients: ["Beaten Rice (Chiura)", "Buffalo Meat", "Black Soybeans", "Mustard Oil", "Himalayan Rock Salt"],
                homestays: [
                    { name: "Patn Heritage Home", loc: "Lalitpur", rating: 4.7 },
                    { name: "Bhaktapur Cultural Stay", loc: "Bhaktapur", rating: 4.9 }
                ]
            },
            sherpa: {
                title: "Sherpa Mountain Fare",
                region: "Solu-Khumbu (Everest)",
                image: "placeholder",
                imageAlt: "A steaming bowl of Sherpa Stew (Thenduk) served in a traditional hand-painted Tibetan ceramic bowl. The stew features hand-pulled noodles, winter vegetables, and bits of yak meat in a rich, savory broth. The background shows a cozy mountain hut with a wood-burning stove and views of snow-capped peaks through a window. The lighting is low-key and intimate, emphasizing the warmth of mountain hospitality.",
                description: "High-altitude Sherpa cuisine is designed for endurance and warmth. It relies heavily on hearty grains like barley and potatoes, which are staples of the Himalayan highlands, providing the energy needed for mountain life.",
                ingredients: ["Barley Flour (Tsampa)", "Yak Cheese (Chhurpi)", "Potatoes", "Radish", "Buckwheat Noodles"],
                homestays: [
                    { name: "Namche Hearth", loc: "Namche Bazaar", rating: 5.0 },
                    { name: "Khumbu Valley Inn", loc: "Phakding", rating: 4.6 }
                ]
            }
        };

        function openPanel(regionKey) {
            const data = regionalData[regionKey];
            const panel = document.getElementById('detail-panel');
            const content = document.getElementById('dynamic-body');

            content.innerHTML = `
                <div class="space-y-md">
                    <div class="relative w-full h-64 rounded-xl overflow-hidden shadow-sm">
                        <img src="${data.image}" data-alt="${data.imageAlt}" class="w-full h-full object-cover">
                        <div class="absolute bottom-0 left-0 right-0 p-md bg-gradient-to-t from-black/60 to-transparent">
                            <span class="bg-dhaka-red text-white text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-widest mb-1 inline-block">Regional Specialty</span>
                            <h2 class="text-white font-display-lg-mobile text-display-lg-mobile">${data.title}</h2>
                        </div>
                    </div>

                    <div class="flex items-center gap-sm text-on-surface-variant">
                        <span class="material-symbols-outlined text-dhaka-red">location_on</span>
                        <span class="font-label-sm text-label-sm">${data.region}</span>
                    </div>

                    <div class="space-y-sm">
                        <h4 class="font-headline-md text-headline-md text-primary">The Heritage</h4>
                        <p class="font-body-md text-body-md text-on-surface-variant leading-relaxed">${data.description}</p>
                    </div>

                    <div class="space-y-sm">
                        <h4 class="font-headline-md text-headline-md text-primary">Signature Ingredients</h4>
                        <div class="flex flex-wrap gap-xs">
                            ${data.ingredients.map(ing => `
                                <span class="bg-surface-container-high px-sm py-1 rounded-full text-on-surface-variant font-label-sm text-label-sm border border-outline-variant/30">
                                    ${ing}
                                </span>
                            `).join('')}
                        </div>
                    </div>

                    <div class="space-y-sm">
                        <div class="flex justify-between items-center">
                            <h4 class="font-headline-md text-headline-md text-primary">Featured Homestays</h4>
                            <a href="#" class="text-dhaka-red font-label-sm text-label-sm underline">View All</a>
                        </div>
                        <div class="space-y-sm">
                            ${data.homestays.map(stay => `
                                <div class="flex items-center justify-between p-sm bg-white rounded-xl border border-outline-variant/20 hover:shadow-md transition-shadow cursor-pointer">
                                    <div class="flex items-center gap-sm">
                                        <div class="w-12 h-12 bg-surface-container-highest rounded-lg flex items-center justify-center">
                                            <span class="material-symbols-outlined text-primary">home</span>
                                        </div>
                                        <div>
                                            <p class="font-label-sm text-label-sm text-on-surface font-bold">${stay.name}</p>
                                            <p class="text-[12px] text-on-surface-variant">${stay.loc}</p>
                                        </div>
                                    </div>
                                    <div class="flex items-center text-primary">
                                        <span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1;">star</span>
                                        <span class="font-label-xs-bold text-label-xs-bold ml-1">${stay.rating}</span>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;

            panel.classList.remove('translate-x-full');
        }

        function closePanel() {
            const panel = document.getElementById('detail-panel');
            panel.classList.add('translate-x-full');
        }

        // Close panel when clicking outside on the map
        document.getElementById('nepal-map').addEventListener('click', function(e) {
            if (e.target.id === 'nepal-map' || e.target.tagName === 'IMG') {
                closePanel();
            }
        });
    </script>
</body></html>
