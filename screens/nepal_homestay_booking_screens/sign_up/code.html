<body class="bg-background text-on-background font-body-md overflow-x-hidden min-h-screen flex flex-col">
<!-- Top AppBar Integration -->

<h1 class="font-headline-md text-headline-md text-primary dark:text-primary-fixed-dim tracking-tight">Aama's Kitchen</h1>
</div>
<div class="w-10 h-10 rounded-full bg-surface-container-high overflow-hidden border border-outline-variant">
<img class="w-full h-full object-cover" data-alt="A professional studio portrait of a friendly hospitality concierge, smiling warmly against a soft-focus background of a rustic, high-end Nepalese resort interior. The lighting is golden and inviting, highlighting natural skin tones and traditional brass decor elements. The overall aesthetic is clean, modern, and trustworthy, with a soft blur that emphasizes the person's welcoming expression." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBpN2s4nBJ3A97MiJXdK8ppO-DqA7r7Z8DhJOwe_vXOu_O80bpU-i6gHveZUzV2Hp0GJLMpMso7X7MmwbsLRP86QEpsrXDekDItkcb3g0B7o7KhYYgUs1vgP2wbTmBZPhekU8egoGoMaNaROBN4yzMWXvvuWsj4n-5bMnKscfXzhV4WsRfOHbPKnEmPYXKPvnJEj_jDF5OpuaRmG9qzZuZs7WwqFcq9f-09C8UvqPHXjNGLoQiRi2Lb5oSnPogG7k7cvcmcXmp0Cd0"/>
</div>
</header>
<main class="flex-grow relative flex items-center justify-center py-xl px-margin-mobile">
<!-- Atmospheric Background Elements -->
<div class="absolute inset-0 z-0 pointer-events-none overflow-hidden">
<div class="dhaka-pattern absolute inset-0"></div>
<div class="absolute top-[-10%] right-[-10%] w-[40%] h-[60%] bg-primary opacity-5 blur-[120px] rounded-full"></div>
<div class="absolute bottom-[-10%] left-[-10%] w-[40%] h-[60%] bg-secondary opacity-5 blur-[120px] rounded-full"></div>
</div>
<!-- Registration Card -->
<div class="relative z-10 w-full max-w-lg bg-surface-container-lowest rounded-xl hearth-glow border border-surface-variant overflow-hidden">
<!-- Decorative Header -->
<div class="h-2 w-full bg-gradient-to-r from-primary via-secondary to-primary"></div>
<div class="p-8 md:p-12">
<div class="text-center mb-10">
<h2 class="font-display-lg-mobile text-display-lg-mobile md:text-headline-md text-on-surface mb-2">Join the Hearth</h2>
<p class="text-on-surface-variant font-body-md">Begin your journey into authentic Himalayan flavors and home-stays.</p>
</div>
<form class="space-y-6" id="signup-form">
<!-- Full Name -->
<div class="space-y-1">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-1" for="full-name">Full Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-body-md">person</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface border border-outline-variant rounded-lg font-body-md text-on-surface placeholder:text-surface-dim transition-all input-focus-ring" id="full-name" placeholder="Arjun Shrestha" type="text"/>
</div>
</div>
<!-- Email -->
<div class="space-y-1">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-1" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-body-md">mail</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface border border-outline-variant rounded-lg font-body-md text-on-surface placeholder:text-surface-dim transition-all input-focus-ring" id="email" placeholder="arjun@example.com" type="email"/>
</div>
</div>
<!-- Phone -->
<div class="space-y-1">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-1" for="phone">Phone Number</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-body-md">call</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface border border-outline-variant rounded-lg font-body-md text-on-surface placeholder:text-surface-dim transition-all input-focus-ring" id="phone" placeholder="+977 980-0000000" type="tel"/>
</div>
</div>
<!-- Password -->
<div class="space-y-1">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-1" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-body-md">lock</span>
<input class="w-full pl-10 pr-12 py-3 bg-surface border border-outline-variant rounded-lg font-body-md text-on-surface placeholder:text-surface-dim transition-all input-focus-ring" id="password" placeholder="••••••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Terms -->
<div class="flex items-start gap-3 pt-2">
<div class="mt-1">
<input class="w-5 h-5 rounded border-outline-variant text-primary focus:ring-secondary cursor-pointer" id="terms" type="checkbox"/>
</div>
<label class="font-body-md text-on-surface-variant leading-tight" for="terms">
                            I agree to the <a class="text-primary font-semibold hover:underline" href="#">Terms &amp; Conditions</a> and <a class="text-primary font-semibold hover:underline" href="#">Privacy Policy</a> of Aama's Kitchen.
                        </label>
</div>
<!-- CTA -->
<div class="pt-4">
<button class="w-full py-4 bg-primary text-on-primary font-headline-md text-headline-md rounded-full transition-all active:scale-95 button-inner-glow hearth-glow" type="submit">
                            Create Account
                        </button>
</div>
</form>
<div class="mt-8 pt-8 border-t border-surface-variant text-center">
<p class="font-body-md text-on-surface-variant">
                        Already part of the family? 
                        <a class="text-secondary font-bold hover:text-primary transition-colors ml-1" href="#">Sign In</a>
</p>
</div>
</div>
</div>

<!-- Footer Meta -->
<footer class="py-base text-center text-on-surface-variant font-label-sm px-margin-mobile">
<p>© 2024 Aama's Kitchen. Inspired by the Himalayan spirit.</p>
</footer>
<!-- Interactive Elements Script -->
<script>
        document.getElementById('signup-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.innerText;
            btn.innerText = 'Creating Account...';
            btn.disabled = true;
            btn.classList.add('opacity-80');
            
            setTimeout(() => {
                alert('Namaste! Welcome to Aama\'s Kitchen family.');
                btn.innerText = originalText;
                btn.disabled = false;
                btn.classList.remove('opacity-80');
            }, 1500);
        });

        // Toggle Password Visibility
        const passToggle = document.querySelector('button[type="button"]');
        const passInput = document.getElementById('password');
        passToggle.addEventListener('click', () => {
            const isPassword = passInput.type === 'password';
            passInput.type = isPassword ? 'text' : 'password';
            passToggle.querySelector('.material-symbols-outlined').innerText = isPassword ? 'visibility_off' : 'visibility';
        });

        // Focus Interaction
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.parentElement.classList.add('scale-[1.01]');
            });
            input.addEventListener('blur', () => {
                input.parentElement.parentElement.classList.remove('scale-[1.01]');
            });
        });
    </script>
