<body class="bg-background text-on-background font-body-md overflow-hidden">

<!-- Atmospheric Element -->

<span class="material-symbols-outlined text-secondary-fixed text-sm">wb_twilight</span>

</div>

</footer>

<div class="absolute -bottom-20 -left-20 w-64 h-64 bg-primary/20 blur-[100px] rounded-full pointer-events-none z-10"></div>

<script>
        function handleStart() {
            // Micro-interaction: visual feedback before "navigating"
            const btn = document.querySelector('button');
            btn.innerHTML = `
                <span class="material-symbols-outlined animate-spin">progress_activity</span>
                <span>Opening the Kitchen...</span>
            `;
            btn.classList.add('opacity-90');
            
            // Artificial delay to show intent
            setTimeout(() => {
                console.log("Redirecting to exploration phase...");
                // In a real app: window.location.href = '/explore';
            }, 800);
        }

        // Parallax Effect for Background
        document.addEventListener('mousemove', (e) => {
            const moveX = (e.clientX - window.innerWidth / 2) * 0.01;
            const moveY = (e.clientY - window.innerHeight / 2) * 0.01;
            const bg = document.querySelector('.scale-105');
            bg.style.transform = `scale(1.05) translate(${moveX}px, ${moveY}px)`;
        });
    </script>
